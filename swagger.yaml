openapi: 3.0.3
info:
  title: API REST GreenBite - Autenticación y Registro
  version: 1.0.0
  description: Especificación de endpoints para el módulo de Auth a través del BFF.
servers:
  - url: http://localhost:8082/api/bff
paths:
  /registro:
    post:
      summary: Registro de nuevos usuarios en el sistema
      operationId: registrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioDTO'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            text/plain:
              schema:
                type: string
                example: "Usuario registrado con éxito"
  /login:
    post:
      summary: Autenticación de usuarios
      operationId: loginUsuario
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            example: benja@duocuc.cl
        - name: password
          in: query
          required: true
          schema:
            type: string
            example: password123
      responses:
        '200':
          description: Login exitoso
          content:
            text/plain:
              schema:
                type: string
                example: "Login exitoso"
        '401':
          description: Credenciales incorrectas
          content:
            text/plain:
              schema:
                type: string
                example: "Credenciales invalidas"
components:
  schemas:
    UsuarioDTO:
      type: object
      properties:
        rut:
          type: string
          example: "12.345.678-9"
        nombre:
          type: string
          example: "Benjamin"
        apellido:
          type: string
          example: "Ruz"
        email:
          type: string
          example: "benja@duocuc.cl"
        password:
          type: string
          example: "password123"
        fechaNacimiento:
          type: string
          format: date
          example: "2000-01-01"
        direccion:
          type: string
          example: "Av. Alameda 123"
        region:
          type: string
          example: "Metropolitana"
        comuna:
          type: string
          example: "Lo Espejo"